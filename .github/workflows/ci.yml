name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uv lock --check
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}

      - name: Install Vim and bat (macOS)
        if: runner.os == 'macOS'
        run: brew install vim bat

      - name: Install Vim and bat (Linux)
        if: runner.os == 'Linux'
        # Debian and Ubuntu name bat's binary batcat.
        run: |
          sudo apt-get update
          sudo apt-get install -y vim bat
          sudo ln -s /usr/bin/batcat /usr/local/bin/bat

      - run: uv sync --locked
      - run: uv run pytest
